name: Miking CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, synchronize]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OCaml and opam for Miking
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install opam packages
        run: |
          # Install dependencies of owl
          sudo apt-get install -y liblapacke-dev libopenblas-dev

          # Use the latest owl from GitHub
          git clone --depth 1 https://github.com/owlbarn/owl.git "$RUNNER_TEMP/owl"
          git -C "$RUNNER_TEMP/owl" log -1 --oneline
          opam pin add -y -n --kind=path owl-base "$RUNNER_TEMP/owl"
          opam pin add -y -n --kind=path owl "$RUNNER_TEMP/owl"
          
          # Enable OpenMP explicitly for owl
          export OWL_ENABLE_OPENMP=1

          # Install all opam packages used in make test
          opam install -y dune linenoise pyml toml lwt owl ocamlformat.0.29.0

      - name: Build Miking
        timeout-minutes: 10
        run: |
          eval $(opam env)
          make install

      - name: Run tests
        timeout-minutes: 60
        run: |
          eval $(opam env)
          make test

  build-and-test-mac-os:
    # macos-latest and owl do not like each other
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install OCaml and opam for Miking
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install opam packages
        run: |
          # Install dependencies of owl
          brew install pkg-config autoconf openblas libomp fftw

          # Use the latest owl from GitHub
          git clone --depth 1 https://github.com/owlbarn/owl.git "$RUNNER_TEMP/owl"
          git -C "$RUNNER_TEMP/owl" log -1 --oneline
          opam pin add -y -n --kind=path owl-base "$RUNNER_TEMP/owl"
          opam pin add -y -n --kind=path owl "$RUNNER_TEMP/owl"

          # Export environment variable needed by openblas
          export OWL_LDFLAGS="-L/opt/homebrew/opt/libomp/lib -lomp"
          export OWL_CPPFLAGS="-Xpreprocessor -fopenmp"

          # Install all opam packages used in make test
          opam install -y dune linenoise pyml toml lwt menhir owl ocamlformat.0.29.0

      - name: Build Miking
        timeout-minutes: 30
        run: |
          eval $(opam env)
          make install

      - name: Run tests
        timeout-minutes: 60
        run: |
          eval $(opam env)
          make test
